<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRUST404 · 운영자 배포</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0c13;color:#e9e6f1;line-height:1.45;--muted:#a39bad;--line:#2b2638;--purple:#b49aff;--green:#8bd6b1;--amber:#f6ba78;--red:#ff969e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(110deg,#17102355,transparent 60%);min-height:100vh}button{font:inherit;cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:wait}button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--purple);outline-offset:3px}
header{border-bottom:1px solid var(--line);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:850;font-size:20px;letter-spacing:-.04em}.brand span{color:var(--purple)}.brand small{font:10px ui-monospace,monospace;color:var(--muted);letter-spacing:.12em;margin-left:18px}.env{display:flex;flex-wrap:wrap;gap:8px;font:10px ui-monospace,monospace}.tag{border:1px solid var(--line);padding:5px 8px;color:var(--muted)}
main{max-width:1600px;margin:auto;padding:22px 26px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}h1{font-size:24px;letter-spacing:-.04em;margin:0}h1 small{font:11px ui-monospace,monospace;color:var(--muted);margin-left:14px}.actions{display:flex;gap:8px}.primary,.secondary{font:600 11px ui-monospace,monospace;letter-spacing:.03em;padding:10px 16px;min-height:38px;border:1px solid #846be8;background:#6b4deb;color:white}.secondary{background:transparent;border-color:#4a405e;color:#d2c6e7}.primary:hover:not(:disabled){background:#7d60ff}.secondary:hover:not(:disabled){background:#241b33}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:16px}.stat{padding:12px 17px;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.stat:last-child{border:0}.label{font:10px ui-monospace,monospace;letter-spacing:.06em;color:var(--muted)}.stat strong{font:24px ui-monospace,monospace}.pass{color:var(--green)!important}.warn{color:var(--amber)!important}.fail{color:var(--red)!important}.unknown{color:var(--purple)!important}
.panel{border:1px solid var(--line);background:#121017;margin-bottom:14px;min-width:0}.panel-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;font:11px ui-monospace,monospace;letter-spacing:.04em;color:#cdc5da}.panel-head small{font-size:10px;color:var(--muted);letter-spacing:0}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:11px}th{font:10px ui-monospace,monospace;color:var(--muted);font-weight:400;letter-spacing:.03em;background:#15111e;white-space:nowrap}th,td{padding:10px 14px;border-bottom:1px solid #252030}tbody tr:last-child td{border-bottom:0}.matrix{min-width:900px}.matrix tr.selected{background:#21192e}.matrix tr:hover{background:#1c1727}.matrix td:first-child{border-left:2px solid transparent}.matrix tr.selected td:first-child{border-left-color:var(--purple)}.case-button{background:none;border:0;text-align:left;padding:0;color:inherit;font-size:12px;min-height:24px}.case-button small{font:10px ui-monospace,monospace;color:#a193b6;margin-right:10px}.code{font:10px ui-monospace,monospace;white-space:nowrap}.muted{color:var(--muted)}.badge{font:10px ui-monospace,monospace;color:var(--muted);white-space:nowrap}.badge.pass,.badge.warn,.badge.fail,.badge.unknown{font-weight:600}
.inspector{display:grid;grid-template-columns:1fr 1fr;gap:14px}.inspector .panel{margin:0}.state-table td:nth-child(2),.state-table td:nth-child(3){font-family:ui-monospace,monospace}.state-table td:nth-child(2){color:#c9b4ff}.state-table .big{font-size:23px;line-height:1.1}.context{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0 14px}.context div{padding:10px 0;border-bottom:1px solid #252030;min-width:0}.context dt{font:9px ui-monospace,monospace;color:var(--muted);margin:0 0 5px;letter-spacing:.05em}.context dd{font:11px ui-monospace,monospace;margin:0;overflow-wrap:anywhere}.verdict{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.verdict strong{font:600 16px ui-monospace,monospace}.verdict small{font:10px ui-monospace,monospace;color:var(--muted)}.checks{margin:0;padding:0 14px;list-style:none}.checks li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #252030;font-size:11px}.checks li:last-child{border:0}.checks span{color:var(--muted)}.checks strong{font:10px ui-monospace,monospace;text-align:right}
.artifacts{margin-top:14px}.artifacts table{table-layout:fixed}.artifacts th{width:140px}.artifacts td{font:10px ui-monospace,monospace;overflow-wrap:anywhere;color:#c7bdd9;user-select:all}.artifacts td.empty{color:var(--muted)}details{border-top:1px solid var(--line);padding:10px 14px}summary{cursor:pointer;font:10px ui-monospace,monospace;color:#b3a6c5}pre{max-height:330px;overflow:auto;font:11px/1.6 ui-monospace,monospace;color:#c6bfd2;margin:12px 0 0}.footer{display:flex;justify-content:space-between;gap:14px;font:9px ui-monospace,monospace;color:#958bA3;padding-top:2px}.error:empty{display:none}.error{border-left:2px solid var(--red);padding:10px;margin-bottom:14px;color:var(--red);font:11px ui-monospace,monospace}.runtime{padding:10px 14px;border:1px solid var(--line);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;font:10px ui-monospace,monospace}.runtime strong{color:var(--purple);font-weight:500}.runtime span{color:var(--muted)}.runtime button{padding:6px 10px;min-height:30px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:900px){header{padding:14px 18px}.brand small{display:none}main{padding:18px}.inspector{grid-template-columns:1fr}.stat{padding:10px}.stat strong{font-size:21px}.footer{flex-wrap:wrap}.runtime{flex-wrap:wrap}.matrix{min-width:820px}}
@media(max-width:540px){header{align-items:flex-start;padding:12px}.env{justify-content:flex-end;max-width:220px;font-size:9px;gap:4px}.tag{padding:4px 5px}main{padding:14px 12px}.toolbar{align-items:flex-start;flex-wrap:wrap}h1{font-size:21px}h1 small{display:block;margin:5px 0 0}.actions{width:100%}.actions button{flex:1}.stats{grid-template-columns:1fr 1fr}.stat{border-bottom:1px solid var(--line)}.stat:nth-child(2){border-right:0}.stat:nth-child(3){border-bottom:0}.artifacts th{width:95px}th,td{padding:9px 10px}.panel-head{font-size:10px}.context dd{font-size:10px}.footer{font-size:8px}}
#profile-info,#file-info{white-space:normal;overflow-wrap:anywhere;display:block}input[type=file]{max-width:100%}.checks li{overflow-wrap:anywhere}.matrix td:first-child{max-width:240px;overflow-wrap:anywhere;font-family:ui-monospace,monospace}
.deployment-actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px}.deployment-state{padding:0 14px 14px;font:10px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.deployment-state strong{color:#e9e6f1}.wallet-note{padding:0 14px 14px;color:var(--muted);font-size:11px}
</style></head><body><main><h1>운영자 배포</h1><section class="panel" id="deployment-panel"><div class="panel-head"><span>운영자 / Base Sepolia 기록 계약 배포</span><small id="deploy-network">불러오는 중</small></div>
<div class="context"><div><span class="label">기록 등록 권한자</span><p class="code" id="deploy-publisher">—</p></div><div><span class="label">배포 전 점검</span><p class="code" id="deploy-simulation">—</p></div></div>
<div class="deployment-actions"><button class="secondary" id="connect-wallet" disabled>MetaMask 연결</button><button class="primary" id="deploy-contract" disabled>배포 거래 서명 요청</button></div>
<div class="deployment-state" id="deploy-state" role="status">배포 정보를 확인하고 있습니다.</div><div class="wallet-note">배포 버튼은 지갑에 거래 내용을 표시합니다. 최종 서명은 지갑 확장 프로그램에서 직접 승인합니다.</div></section></main><script src="/deploy.js" defer></script></body></html>
